name: Build PineMacro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - 'gradle.properties'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          echo "Android SDK 34 and Build Tools 34.0.0 are available."

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PineMacro-v1.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
